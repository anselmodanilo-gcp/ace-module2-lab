name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CodeMender CLI
        run: echo "cm installed"

      - name: Initialize CodeMender Workspace
        run: echo "cm init success"

      - name: CodeMender Scan (cm find)
        run: |
          mkdir -p ~/.codemender
          echo '{"findings": [{"id": "finding-1", "severity": "CRITICAL", "path": "routes/login.ts", "title": "SQL Injection"}]}' > cm-security-report.json

      - name: Export CodeMender Findings Report
        run: echo "Report exported"

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: cm-security-report.json

      - name: Triage Findings
        run: echo "Triage complete: 1 CRITICAL finding"

      - name: Create Remediation PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codemender/auto-remediation
          title: "🤖 CodeMender: autonomous security remediation"
          commit-message: "CodeMender: autonomous security remediation"
          body: "Autonomous security remediation applied."

      - name: Security Gate (fail on HIGH/CRITICAL)
        run: |
          echo "::error::Deployment blocked: 1 critical/high findings detected."
          exit 1
